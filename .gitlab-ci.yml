# skald CI
#
# Two stages: test (typecheck, unit tests, file-size, plugin-lint across the
# workspace) and build (compile the Obsidian plugin). No deployment from CI —
# the plugin ships via BRAT + the community plugins directory (manual release
# cuts for now).
#
# Caches the pnpm store keyed on the lockfile so subsequent runs reuse
# the resolution work.

default:
  image: node:22
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.1.1 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

stages:
  - test
  - build

typecheck:
  stage: test
  script:
    - pnpm typecheck

unit-tests:
  stage: test
  script:
    - pnpm test

file-size:
  stage: test
  script:
    - pnpm check:size

plugin-lint:
  stage: test
  script:
    - pnpm check:lint

# Coverage is reported (visible measure) but NOT yet gated on a threshold —
# a floor is added once the baseline is agreed so it ratchets up, never down.
# Note: the Obsidian-DOM view layer is intentionally CDP-tested, not unit-tested,
# so statement coverage understates the pure-logic coverage.
coverage:
  stage: test
  script:
    - pnpm test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 2 weeks

# Supply-chain gate: fail the pipeline on any vulnerability in PRODUCTION
# dependencies (currently zero). Dev-only advisories are tracked separately.
audit-prod:
  stage: test
  script:
    - pnpm audit:prod

build-plugin:
  stage: build
  needs: ['typecheck']
  script:
    - pnpm --filter @skald/plugin build
  artifacts:
    name: 'skald-plugin-$CI_COMMIT_SHORT_SHA'
    paths:
      - packages/plugin/dist/
    expire_in: 2 weeks
