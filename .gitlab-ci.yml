# skald CI
#
# Three stages: test (typecheck, unit tests, plugin-lint across the
# workspace), build (compile the Obsidian plugin) and e2e (the built plugin
# driven inside real desktop Obsidian, plus the live-provider smoke). No
# deployment from CI — the plugin ships via BRAT + the community plugins
# directory (manual release cuts for now).
#
# Caches the pnpm store keyed on the lockfile so subsequent runs reuse
# the resolution work.
#
# Image: the estate's shared CI builder from dunn.dev/pipeline (Fedora +
# node + npm + tooling), pulled from GitLab's registry. NOT Docker Hub's
# `node:22` — the self-hosted runner pulls that unauthenticated and hits
# Docker Hub's anon rate limit, which intermittently failed jobs at the
# image-pull step. skald is pnpm; the shared image is npm-based, so we
# bootstrap pnpm with `npm i -g` (corepack isn't guaranteed on the image).

default:
  image: registry.gitlab.com/dunn.dev/pipeline/ci:4.14.0@sha256:8b96e0081195a2b5f6934a8a7b1f2af277778639b3860f128a532a010e0e289c
  # Untagged: jobs run on the shared SaaS runners. No self-hosted runner in the group accepts untagged jobs.
  # Resilience net for the storr runner's egress: get_sources clone timeouts
  # off that host land as script_failure (not runner_system_failure), and a
  # genuinely hung job would otherwise run to whatever GitLab's project-wide
  # default timeout is with zero retry. 15m ceiling — every job here normally
  # completes in 20-30s (observed), so this only ever fires on a real hang.
  # Mirrors nomograph/pipeline's per-job retry/timeout convention. server_timeout_running
  # / server_timeout_canceling (not the deprecated job_execution_timeout — GitLab
  # 19.1 split it into these two; confirmed via this project's own ci/lint output)
  # cover a job that hangs past `timeout:`. Deliberately does NOT include
  # script_failure — that would also silently retry a genuinely broken
  # test/lint/build failure, masking real breakage.
  timeout: 15m
  retry:
    max: 2
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure, api_failure, unknown_failure, server_timeout_running, server_timeout_canceling]
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    - npm install -g pnpm@11.1.1
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

stages:
  - test
  - build
  - e2e

typecheck:
  stage: test
  script:
    - pnpm typecheck

unit-tests:
  stage: test
  script:
    - pnpm test

plugin-lint:
  stage: test
  script:
    - pnpm lint

# Coverage is reported AND gated: test:coverage enforces a ratchet floor on the
# pure, unit-testable core (vitest.config thresholds; the Obsidian-DOM view layer
# is excluded because it's CDP/on-device-tested, not unit-testable). Floor never
# regresses; raise toward 90% as gap-filling lands.
coverage:
  stage: test
  script:
    - pnpm test:coverage
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 2 weeks

# Supply-chain gate: fail the pipeline on any vulnerability in PRODUCTION
# dependencies (currently zero). Dev-only advisories are tracked separately.
audit-prod:
  stage: test
  script:
    - pnpm audit:prod

# Mutation testing on the high-risk wire-format parsers — the quality backstop
# behind the coverage floor (high line-coverage means little if mutants survive).
# Schedule-gated (nightly) only: it's slower and informational, not on the per-push
# hot path. Create a pipeline schedule in GitLab (CI/CD → Schedules) to run it.
# Current baseline mutation score ~77% (break threshold 70).
mutation:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - pnpm test:mutation
  artifacts:
    when: always
    paths:
      - reports/mutation/
    expire_in: 2 weeks

build-plugin:
  stage: build
  needs: ['typecheck']
  script:
    - pnpm --filter @skald/plugin build
  artifacts:
    name: 'skald-plugin-$CI_COMMIT_SHORT_SHA'
    paths:
      - packages/plugin/dist/
    expire_in: 2 weeks

# wdio-obsidian-service drives the pinned Obsidian app (version pinned in
# packages/e2e/wdio.conf.mts) against the fixture vault: desktop, then the
# same scenes with emulateMobile at 390x844, against a local mock provider.
# Obsidian is an Electron app, so the job installs the X server, a window
# manager (some Obsidian features need one) and Electron's shared libraries,
# then runs under Xvfb. The downloaded Obsidian lives in .obsidian-cache/,
# cached on the pinned versions.
e2e-obsidian:
  stage: e2e
  needs: ['build-plugin']
  timeout: 30m
  cache:
    - key:
        files:
          - pnpm-lock.yaml
      paths:
        - .pnpm-store/
    - key:
        files:
          - packages/e2e/wdio.conf.mts
      paths:
        - .obsidian-cache/
  before_script:
    - npm install -g pnpm@11.1.1
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - dnf install -y --setopt=install_weak_deps=False xorg-x11-server-Xvfb herbstluftwm xdotool gtk3 nss alsa-lib libXScrnSaver libXtst at-spi2-core mesa-libgbm libdrm cups-libs xdg-utils
  script:
    - export DISPLAY=:99
    - Xvfb "$DISPLAY" -screen 0 1280x1024x24 +extension GLX -noreset &
    - sleep 1
    - herbstluftwm &
    - sleep 1
    - pnpm --filter @skald/e2e test
  artifacts:
    when: always
    paths:
      - packages/e2e/out/
    expire_in: 2 weeks

# One tiny streamed request per provider against the real API (cheapest model,
# max_tokens 20). Each provider skips itself when its masked CI variable is
# unset (SKALD_SMOKE_ANTHROPIC_KEY, SKALD_SMOKE_OPENROUTER_KEY,
# SKALD_SMOKE_OPENAI_KEY + SKALD_SMOKE_OPENAI_BASE_URL). Default-branch and
# scheduled pipelines only: merge-request pipelines never spend tokens. The
# script is plain node, so it skips the pnpm install.
smoke-live:
  stage: e2e
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  cache: []
  before_script: []
  script:
    - node scripts/smoke-live.mjs
