<svg viewBox="0 0 256 256" width="256" height="256" font-family="Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="skald avatar — vault-native Claude client for Obsidian, with the dunn.dev rune as placeholder glyph.">
  <g font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="256" height="256" fill="#ffffff"/>
  <rect x="0" y="0" width="256" height="256" fill="none" stroke="#e0e0e0" stroke-width="1"/>

  <!-- title block: y 0-90 -->
  <text x="128" y="56" text-anchor="middle" font-size="32" font-weight="700" fill="#4a6741">skald</text>
  <text x="128" y="76" text-anchor="middle" font-size="10" fill="#707070">vault-native Claude client for Obsidian</text>

  <!-- glyph band: y 90-200. Replace this group with the project's metaphorical mark.
       Template ships with the dunn.dev rune as a working placeholder. -->
  <g transform="translate(96 100) scale(1)" stroke="#4a6741" fill="none" stroke-linecap="round">
    <line x1="33.8" y1="9.8"  x2="46.2" y2="22.2" stroke-width="2"/>
    <line x1="46.2" y1="25.8" x2="33.8" y2="38.2" stroke-width="2"/>
    <line x1="30.2" y1="38.2" x2="17.8" y2="25.8" stroke-width="2"/>
    <line x1="17.8" y1="22.2" x2="30.2" y2="9.8"  stroke-width="2"/>
    <line x1="30.4" y1="41.9" x2="19.6" y2="54.1" stroke-width="2"/>
    <line x1="33.6" y1="41.9" x2="44.4" y2="54.1" stroke-width="2"/>
    <circle cx="32" cy="8"  r="2.5" stroke-width="1.5"/>
    <circle cx="48" cy="24" r="2.5" stroke-width="1.5"/>
    <circle cx="32" cy="40" r="2.5" stroke-width="1.5"/>
    <circle cx="16" cy="24" r="2.5" stroke-width="1.5"/>
    <circle cx="18" cy="56" r="2.5" stroke-width="1.5"/>
    <circle cx="46" cy="56" r="2.5" stroke-width="1.5"/>
    <circle cx="32" cy="24" r="2"   stroke-width="1.5"/>
  </g>

  <!-- output line: y 200-256 -->
  <line x1="40" y1="200" x2="216" y2="200" stroke="#e0e0e0" stroke-width="1"/>
  <text x="128" y="218" text-anchor="middle" font-size="9" font-weight="600" fill="#0a0a0a">mobile-first chat · MCP server · BYO Anthropic key</text>
  <text x="128" y="232" text-anchor="middle" font-size="8" fill="#707070">obsidian plugin · cloudflare worker</text>
  </g>
</svg>
