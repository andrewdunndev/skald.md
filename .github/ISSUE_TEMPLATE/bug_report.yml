name: Bug report
description: Report a bug in Skald.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Skald is maintained as time allows; bug reports with a repro get priority. Source and CI live on GitLab (https://gitlab.com/dunn.dev/skald.md); issues are tracked here.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence -- what broke.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs actual
      placeholder: |
        Expected:

        Actual:

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - iPadOS
        - Desktop

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Anthropic
        - OpenRouter

  - type: input
    id: obsidian_version
    attributes:
      label: Obsidian version

  - type: input
    id: skald_version
    attributes:
      label: Skald version

  - type: textarea
    id: logs
    attributes:
      label: Console logs / screenshots
      description: Open the Obsidian dev console (Ctrl+Shift+I / Cmd+Option+I) and paste relevant output. Attach screenshots if helpful.
      render: shell
