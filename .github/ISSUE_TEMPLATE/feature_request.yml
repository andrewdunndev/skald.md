name: Feature request
description: Suggest an improvement or new capability for Skald.
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Skald is maintained as time allows; bug reports with a repro get priority. Source and CI live on GitLab (https://gitlab.com/dunn.dev/skald.md); issues are tracked here. There is no feature roadmap; requests are welcome but may not be picked up.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use-case
      description: What are you trying to do? Describe the workflow or friction point, not the solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
