name: Release

# Skald is developed on GitLab (dunn.dev/skald.md); this GitHub repo is the
# mirror. Tags pushed on GitLab auto-mirror here and trigger this workflow,
# which builds the plugin and publishes the four Obsidian release assets
# (manifest.json, main.js, styles.css, versions.json) so BRAT and the
# community-plugins directory can install the release.
#
# Obsidian convention: tags are bare semver with NO leading "v", and the
# manifest version must equal the tag.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.8.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @skald/plugin build

      - name: Assert manifest.version == tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MANIFEST_VERSION=$(node -e "process.stdout.write(require('./packages/plugin/dist/manifest.json').version)")
          if [ "$MANIFEST_VERSION" != "$TAG" ]; then
            echo "ERROR: manifest.version ($MANIFEST_VERSION) does not match tag ($TAG)"
            exit 1
          fi
          echo "OK: manifest.version == $TAG"

      - name: Publish GitHub release with the Obsidian assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            packages/plugin/dist/manifest.json \
            packages/plugin/dist/main.js \
            packages/plugin/dist/styles.css \
            packages/plugin/dist/versions.json \
            --title "$TAG" \
            --notes "Skald $TAG. Docs and changelog at https://skald.md."
